<!doctype html><meta charset="utf-8"><style>body{margin:0;padding:16px;background:#F6F0E4;font:12px sans-serif;display:grid;grid-template-columns:repeat(7,90px);gap:12px}div{display:flex;flex-direction:column;align-items:center;gap:4px}.t{width:52px;height:52px;border-radius:16px;background:#fff;display:grid;place-items:center;color:#0B1636}.ico{width:30px;height:30px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}</style>
<body><script type="module">import {iconosAct} from '../js/ilustraciones.js';document.body.innerHTML=Object.entries(iconosAct).map(([k,v])=>`<div><span class="t">${v}</span>${k}</div>`).join('')</script>
